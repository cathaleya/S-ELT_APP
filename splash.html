<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-ELT - Welcome</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Grand+Hotel&family=Luckiest+Guy&family=Satisfy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles_final.css">
    <style>
        .splash-container {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: url('login_bg_clean.png') center/cover no-repeat !important;
        }

        .splash-logo {
            width: 140px;
            height: 140px;
            background: white;
            border-radius: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 5px solid #bef264;
            animation: pulseLogo 2s infinite ease-in-out;
            margin-bottom: 30px;
        }

        .splash-logo img {
            width: 80%;
        }

        @keyframes pulseLogo {
            0% { transform: scale(1); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
            50% { transform: scale(1.05); box-shadow: 0 30px 70px rgba(190, 242, 100, 0.3); }
            100% { transform: scale(1); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        }

        .loading-text {
            color: #bef264;
            font-family: 'Luckiest Guy', cursive;
            font-size: 48px;
            letter-spacing: 2px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeIn 1s forwards 0.5s;
        }

        .motivation-text {
            text-shadow: 0 0 10px rgba(190, 242, 100, 0.4);
            font-family: 'Outfit', sans-serif;
        }

        .student-animation {
            font-family: 'Satisfy', cursive;
            color: white;
            font-size: 24px;
            opacity: 0;
            animation: fadeIn 1s forwards 1s;
        }

        .loader-bar {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-top: 40px;
            overflow: hidden;
            position: relative;
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background: #bef264;
            box-shadow: 0 0 15px #bef264;
            animation: loadProgress 3s forwards;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Decorative Glows */
        .glow-top {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(190, 242, 100, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        .btn-start {
            display: none;
            margin-top: 30px;
            padding: 15px 40px;
            background: #bef264;
            color: #064e3b;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 900;
            border: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: fadeIn 0.5s forwards;
        }
    </style>
</head>
<body>
    <div class="app-container" style="background: none !important;">
        <main class="splash-container">
            <div class="glow-top"></div>
            
            <div class="splash-logo">
                <img src="logo.png" alt="S-ELT Logo">
            </div>

            <h1 class="loading-text">S-ELT</h1>
            <p class="motivation-text" style="color: #ffffff; font-size: 16px; margin-bottom: 20px; font-weight: 300; letter-spacing: 1px; opacity: 0; animation: fadeIn 1s forwards 1.5s; font-style: italic;">"Empowering your future, one word at a time."</p>
            <p class="student-animation">Preparing your digital classroom...</p>

            <div class="loader-bar">
                <div class="loader-progress"></div>
            </div>

            <button id="start-btn" class="btn-start" onclick="window.location.href='login.html'">GET STARTED</button>
        </main>
    </div>

    <script>
        // Show button after animation instead of auto-redirect for better reliability
        setTimeout(() => {
            document.getElementById('start-btn').style.display = 'block';
        }, 3200);
    </script>
</body>
</html>
