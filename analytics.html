<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-ELT - Analytics</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Playfair+Display:wght@700;800&family=Satisfy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles_final.css">
</head>
<body>
    <div class="app-container">
        <div class="dashboard-wrapper" style="background: #f8f6ec url('batik_bg.png?v=2026') center/cover no-repeat !important; position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
            <!-- Status Bar -->
            <div class="status-bar" style="color: #1a1a1a !important;">
                <span>9:41</span>
                <div class="status-icons">📶 🔋</div>
            </div>

            <main class="page-content">
                <div class="profile-header" style="flex-direction: column; align-items: flex-start; position: relative; padding-top: 60px;">
                    <h2 class="user-name serif" style="font-family: 'Playfair Display'; color: #064e3b; font-weight: 800; font-size: 28px;">Learning Analytics</h2>
                    <span class="logout-btn" onclick="window.location.href='login.html'" style="position: absolute; right: 0; top: 60px; font-size: 10px; color: #e11d48; font-weight: 900; cursor: pointer; text-decoration: underline; text-transform: uppercase;">Log Out</span>
                </div>
                
                <!-- Stat Card -->
                <div class="stat-card" style="width: 100%; height: 180px; margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(6, 78, 59, 0.05); border-radius: 30px;">
                    <div style="width: 130px; height: 130px; border-radius: 50%; border: 12px solid #064e3b; display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; box-shadow: 0 10px 25px rgba(6, 78, 59, 0.1);">
                        <span style="font-size: 28px; font-weight: 900; color: #064e3b;">94%</span>
                        <span style="font-size: 9px; font-weight: 800; color: #6b7280;">MASTERY</span>
                    </div>
                </div>

                <!-- Secondary Stats -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
                    <div style="background: white; padding: 12px; border-radius: 18px; text-align: center; border: 1px solid rgba(6, 78, 59, 0.1);">
                        <p style="font-size: 8px; font-weight: 800; color: #6b7280; text-transform: uppercase;">Module Progress</p>
                        <p style="font-size: 18px; font-weight: 900; color: #064e3b;">4/5</p>
                    </div>
                    <div style="background: white; padding: 12px; border-radius: 18px; text-align: center; border: 1px solid rgba(6, 78, 59, 0.1);">
                        <p style="font-size: 8px; font-weight: 800; color: #6b7280; text-transform: uppercase;">Average Score</p>
                        <p style="font-size: 18px; font-weight: 900; color: #064e3b;">8.9</p>
                    </div>
                </div>

                <div class="section-header">
                    <h3 class="serif" style="color: #064e3b;">Weekly Progress</h3>
                </div>
                <div style="height: 120px; background: white; border-radius: 20px; border: 1px solid rgba(6, 78, 59, 0.1); padding: 20px; display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 25px;">
                    <div style="width: 12%; height: 40%; background: #22c55e; border-radius: 4px;"></div>
                    <div style="width: 12%; height: 60%; background: #ef4444; border-radius: 4px;"></div>
                    <div style="width: 12%; height: 85%; background: #3b82f6; border-radius: 4px;"></div>
                    <div style="width: 12%; height: 45%; background: #f59e0b; border-radius: 4px;"></div>
                    <div style="width: 12%; height: 70%; background: #064e3b; border-radius: 4px;"></div>
                    <div style="width: 12%; height: 30%; background: #ec4899; border-radius: 4px;"></div>
                </div>

                <!-- Footer Milestone Message -->
                <div style="text-align: center; margin-top: 10px;">
                    <p class="welcome-text" style="font-size: 18px; font-weight: 900; color: #064e3b; text-shadow: 0 1px 2px rgba(0,0,0,0.1);">SPEAK Complete!</p>
                </div>
            </main>

            <!-- Bottom Nav -->
            <nav class="bottom-nav">
                <div class="nav-btn btn-home" onclick="window.location.href='dashboard.html'">🏠</div>
                <div class="nav-btn btn-stats active">📊</div>
                <div class="nav-btn btn-trophy" onclick="window.location.href='achievements.html'">🏆</div>
                <div class="nav-btn btn-profile">👤</div>
            </nav>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
